hosts:
  frontendMain: https://playwright.dev
  frontendDocs: https://playwright.dev
  webScrapingDev: https://web-scraping.dev
  calcApi: http://localhost:3000

browser:
  selectors:
    mainPage:
      docsLink:
        kind: role
        role: link
        name: Docs
      heading:
        kind: css
        value: h1
    apiPage:
      heading:
        kind: css
        value: h1

test:
  file_path: tests/scenarios/calculator-demo.yaml
  timeout_ms: 30000

authorized_calculator:
  token_ttl_seconds: 3600
  token_refresh_skew_seconds: 30
  instances:
    primaryCalc:
      token_ttl_seconds: 3600
    secondaryCalc:
      token_ttl_seconds: 7200
      token_refresh_skew_seconds: 60
