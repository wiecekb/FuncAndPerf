- scenarioName: Frontend demo - Playwright selectors
  steps:
    - stepName: Open Playwright and validate search
      stepType: BROWSER
      hostRef: frontendMain
      returnCode: 200
      dataHandlerName: playwrightHome
      additionalData:
        screenshot:
          enabled: true
          mode: onStepEnd
          fullPage: true
          namePrefix: browser-demo
        instructions:
          - kind: action
            action: goto
            value: /
          - kind: assertion
            assertion: toHaveURL
            expected: https://playwright.dev/
          - kind: action
            action: click
            selector: mainPage.docsLink
          - kind: assertion
            assertion: toHaveURL
            expected: https://playwright.dev/docs/intro
          - kind: assertion
            assertion: toContainText
            selector: mainPage.heading
            expected: Installation
          - kind: extract
            extract: url
            saveAs: docsUrl
          - kind: action
            action: screenshot
- scenarioName: Frontend demo - API page heading
  steps:
    - stepName: Open API docs and verify title
      stepType: BROWSER
      hostRef: frontendMain
      returnCode: 200
      dataHandlerName: playwrightApi
      additionalData:
        screenshot:
          enabled: true
          mode: manualOnly
          fullPage: false
          namePrefix: browser-demo-api
        instructions:
          - kind: action
            action: goto
            value: /docs/api/class-playwright
          - kind: assertion
            assertion: toHaveURL
            expected: https://playwright.dev/docs/api/class-playwright
          - kind: assertion
            assertion: toContainText
            selector: apiPage.heading
            expected: Playwright
          - kind: extract
            extract: url
            saveAs: apiDocsUrl
          - kind: action
            action: screenshot
- scenarioName: Frontend demo - Multi-step with shared data
  steps:
    - stepName: 'Step 1: Open Playwright and capture Docs URL'
      stepType: BROWSER
      hostRef: frontendMain
      returnCode: 200
      dataHandlerName: stepOne
      additionalData:
        screenshot:
          enabled: true
          mode: onStepEnd
          fullPage: false
          namePrefix: browser-demo-multistep
        instructions:
          - kind: action
            action: goto
            value: /
          - kind: action
            action: click
            selector: mainPage.docsLink
          - kind: extract
            extract: url
            saveAs: docsUrlFromStep1
    - stepName: 'Step 2: Reuse URL from step 1 on different baseUrl'
      stepType: BROWSER
      hostRef: frontendDocs
      returnCode: 200
      dataHandlerName: stepTwo
      additionalData:
        screenshot:
          enabled: true
          mode: onStepEnd
          fullPage: false
          namePrefix: browser-demo-multistep
        instructions:
          - kind: action
            action: goto
            value: ${ctx.docsUrlFromStep1}
          - kind: assertion
            assertion: toHaveURL
            expected: ${ctx.docsUrlFromStep1}
          - kind: assertion
            assertion: toContainText
            selector: mainPage.heading
            expected: Installation
